<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>HABAL NA V5.5.4 - Rider</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<style>

/* =========================================
   GLOBAL
========================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  background:#f1f1f1;
  color:#222;
}


/* =========================================
   TOP HEADER
========================================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:68px;
  z-index:7000;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    8px
    10px
    8px
    14px;

  background:
    linear-gradient(
      135deg,
      #650000,
      #8b0000,
      #b3131b
    );

  color:white;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.30);
}

.headerBrand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.05;
}

.headerBrand small{
  display:block;
  margin-top:5px;
  font-size:11px;
  font-weight:normal;
  opacity:.9;
  letter-spacing:.3px;
}


/* =========================================
   SQUARE MENU BUTTON
========================================= */

.menuButton{
  width:46px !important;
  min-width:46px !important;
  height:46px;
  margin:0 !important;
  padding:0 !important;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  border:
    1px solid
    rgba(255,255,255,.35);

  background:
    rgba(255,255,255,.16);

  color:white;
  font-size:25px;
  line-height:1;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.18);
}

.menuButton:active{
  transform:scale(.94);
}


/* =========================================
   RIDER MENU
========================================= */

.riderMenu{
  position:fixed;
  top:76px;
  right:10px;

  width:
    min(
      340px,
      calc(100% - 20px)
    );

  z-index:8000;
  display:none;
}

.riderMenu.open{
  display:block;
}

.menuPanel{
  background:white;
  border-radius:17px;
  padding:15px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.30);

  border:
    1px solid
    rgba(0,0,0,.08);
}

.menuPanelTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;

  color:#8b0000;
  font-size:18px;
  font-weight:900;
}

.closeMenu{
  width:38px !important;
  min-width:38px !important;
  height:38px;
  margin:0 !important;
  padding:0 !important;

  border-radius:10px;

  background:#f0f0f0;
  color:#555;
  font-size:22px;
}


/* =========================================
   INPUT
========================================= */

input{
  width:100%;
  padding:13px;

  border:
    1px solid #ccc;

  border-radius:10px;
  margin-bottom:10px;
  font-size:16px;
  outline:none;
  background:#fafafa;
}

input:focus{
  border-color:#8b0000;

  box-shadow:
    0 0 0 2px
    rgba(139,0,0,.08);
}


/* =========================================
   BUTTON
========================================= */

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;

  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:7px;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  transition:
    transform .12s,
    opacity .12s;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.mainBtn{
  background:#8b0000;
  color:white;
}

.greenBtn{
  background:#16833b;
  color:white;
}

.blueBtn{
  background:#1769aa;
  color:white;
}

.orangeBtn{
  background:#e67e00;
  color:white;
}

.grayBtn{
  background:#666;
  color:white;
}

.redBtn{
  background:#c1121f;
  color:white;
}


/* =========================================
   GPS STATUS
========================================= */

.gpsStatus{
  font-size:12px;
  margin-top:8px;
  color:#666;
  word-break:break-word;

  background:#f5f5f5;
  padding:9px;
  border-radius:9px;
}


/* =========================================
   MAP AREA
========================================= */

.container{
  position:fixed;
  top:68px;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  padding:0;
  margin:0;
  overflow:hidden;
  z-index:1;
}


/* =========================================
   MAP CARD
========================================= */

.mapCard{
  position:absolute;
  inset:0;

  margin:0;
  padding:0;

  border-radius:0;

  background:#ddd;
  box-shadow:none;

  z-index:1;
}

.mapCard h3{
  display:none;
}


/* =========================================
   MAP
========================================= */

#map{
  position:absolute;

  top:0;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  height:100%;

  border-radius:0;
  overflow:hidden;
}


/* =========================================
   MAP GPS STATUS
========================================= */

.mapGpsStatus{
  position:absolute;

  top:12px;
  left:12px;

  z-index:1000;

  background:
    rgba(255,255,255,.95);

  color:#555;

  padding:
    8px
    12px;

  border-radius:20px;

  font-size:12px;
  font-weight:bold;

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.20);

  pointer-events:none;
}

.mapGpsStatus.active{
  color:#16833b;

  background:
    rgba(255,255,255,.96);
}


/* =========================================
   BOOKING BOTTOM SHEET
========================================= */

#availableBookingsCard{
  position:fixed;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:
    min(
      700px,
      calc(100% - 8px)
    );

  height:110px;

  margin:0;
  padding:0;

  z-index:5000;

  border-radius:
    20px
    20px
    0
    0;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 -5px 25px
    rgba(0,0,0,.28);

  overflow:hidden;

  transition:
    height .28s
    cubic-bezier(.25,.8,.25,1);

  touch-action:none;
  isolation:isolate;
}


/* =========================================
   EXPANDED SHEET
========================================= */

#availableBookingsCard.expanded{
  height:
    min(
      68vh,
      560px
    );
}


/* =========================================
   SHEET HANDLE
========================================= */

.bookingHandleArea{
  width:100%;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      to bottom,
      #fff,
      #fafafa
    );

  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.bookingHandleArea:active{
  cursor:grabbing;
}

.bookingHandle{
  width:58px;
  height:6px;

  border-radius:20px;
  background:#aaa;

  box-shadow:
    inset 0 1px 2px
    rgba(0,0,0,.15);
}


/* =========================================
   SHEET HEADER
========================================= */

.bookingSheetHeader{
  height:50px;

  padding:
    7px
    15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      135deg,
      #650000,
      #8b0000,
      #a90012
    );

  color:white;

  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.bookingSheetTitle{
  font-size:16px;
  font-weight:900;
}

.bookingCount{
  min-width:30px;
  height:30px;

  padding:
    0
    8px;

  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.20);

  color:white;

  font-size:13px;
  font-weight:bold;
}


/* =========================================
   BOOKING LIST
========================================= */

#bookingList{
  height:
    calc(
      100%
      - 88px
    );

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    10px
    10px
    25px;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

#bookingList::-webkit-scrollbar{
  width:4px;
}

#bookingList::-webkit-scrollbar-thumb{
  background:#aaa;
  border-radius:10px;
}


/* =========================================
   SELECTED BOOKING
========================================= */

#selectedBooking{
  height:
    calc(
      100%
      - 88px
    );

  overflow-y:auto;
  overflow-x:hidden;

  display:none;

  padding:
    12px
    12px
    25px;

  background:white;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

#selectedBooking::-webkit-scrollbar{
  width:4px;
}

#selectedBooking::-webkit-scrollbar-thumb{
  background:#aaa;
  border-radius:10px;
}

.selectedTitle{
  color:#8b0000;
  font-size:20px;
  font-weight:900;
  margin-bottom:6px;
}

.actionGroup{
  margin-top:10px;
}


/* =========================================
   BOOKING
========================================= */

.booking{
  border:
    2px solid #eee;

  border-radius:13px;

  padding:12px;
  margin-bottom:10px;

  background:#fff;

  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;
}

.booking.active{
  border-color:#8b0000;

  box-shadow:
    0 3px 12px
    rgba(139,0,0,.15);
}

.bookingTitle{
  font-size:17px;
  font-weight:900;
  color:#8b0000;
}

.bookingInfo{
  margin-top:5px;
  line-height:1.55;
  font-size:14px;
}


/* =========================================
   STATUS
========================================= */

.status{
  display:inline-block;

  padding:
    5px
    9px;

  border-radius:20px;

  background:#eee;

  font-size:11px;
  font-weight:bold;

  margin-top:7px;
}


/* =========================================
   PICKUP DISTANCE
========================================= */

.pickupDistance{
  display:inline-block;

  margin-top:7px;

  padding:
    6px
    10px;

  border-radius:20px;

  background:#e8f5e9;

  color:#16833b;

  font-weight:bold;
  font-size:13px;
}

.pickupDistance.noGps{
  background:#eee;
  color:#666;
}


/* =========================================
   NEAREST
========================================= */

.nearestBadge{
  display:inline-block;

  margin-left:5px;

  padding:
    5px
    8px;

  border-radius:15px;

  background:#fff3cd;

  color:#856404;

  font-size:10px;
  font-weight:bold;

  vertical-align:middle;
}


/* =========================================
   SWIPE ACCEPT
========================================= */

.swipeArea{
  position:relative;

  height:52px;

  background:#eeeeee;

  border-radius:30px;

  margin-top:12px;

  overflow:hidden;

  touch-action:none;
}

.swipeText{
  position:absolute;

  width:100%;

  text-align:center;

  line-height:52px;

  color:#666;

  font-weight:bold;
  font-size:13px;

  pointer-events:none;
}

.swipeButton{
  position:absolute;

  left:2px;
  top:2px;

  width:48px;
  height:48px;

  margin:0;
  padding:0;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #650000,
      #8b0000,
      #c1121f
    );

  color:white;

  z-index:2;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25);

  touch-action:none;
}


/* =========================================
   TOAST
   FIXED VERSION
========================================= */

.toast{
  position:fixed;

  top:78px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-120px);

  background:#222;
  color:white;

  padding:
    13px
    20px;

  border-radius:30px;

  z-index:99999;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.3);

  font-weight:bold;

  max-width:
    calc(100% - 30px);

  text-align:center;

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .25s ease,
    transform .25s ease,
    visibility 0s linear .25s;
}

.toast.show{
  opacity:1;

  visibility:visible;

  pointer-events:none;

  transform:
    translateX(-50%)
    translateY(0);

  transition:
    opacity .25s ease,
    transform .25s ease,
    visibility 0s;
}


/* =========================================
   NEW BOOKING
========================================= */

.newBooking{
  animation:
    newBookingPulse
    1s
    ease-in-out
    3;
}

@keyframes newBookingPulse{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.02);
  }

}


/* =========================================
   ROUTE INFO
========================================= */

.routeInfo{
  background:#f7f7f7;

  padding:10px;

  border-radius:8px;

  margin-top:8px;
}


/* =========================================
   EMPTY
========================================= */

.emptyBookings{
  text-align:center;

  padding:
    20px
    10px;

  color:#777;

  font-size:14px;
}


/* =========================================
   HIDDEN
========================================= */

.hidden{
  display:none !important;
}


/* =========================================
   SHEET DRAG
========================================= */

.sheet-dragging{
  user-select:none !important;
  -webkit-user-select:none !important;
}

#availableBookingsCard.dragging{
  transition:none !important;
}


/* =========================================
   LEAFLET
========================================= */

.leaflet-container{
  z-index:1;
}

.leaflet-control{
  z-index:900;
}

.leaflet-top,
.leaflet-bottom{
  z-index:900;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

  header{
    height:64px;

    padding:
      7px
      9px
      7px
      12px;
  }

  .headerBrand{
    font-size:20px;
  }

  .headerBrand small{
    font-size:10px;
  }

  .menuButton{
    width:44px !important;
    min-width:44px !important;
    height:44px;
  }

  .container{
    top:64px;
  }

  #availableBookingsCard{
    height:105px;

    width:
      calc(100% - 6px);
  }

  #availableBookingsCard.expanded{
    height:70vh;
  }

  .bookingHandleArea{
    height:36px;
  }

  .bookingSheetHeader{
    height:48px;
  }

  .bookingSheetTitle{
    font-size:15px;
  }

  #bookingList,
  #selectedBooking{
    height:
      calc(
        100%
        - 84px
      );
  }

  .mapGpsStatus{
    top:10px;
    left:10px;
  }

}


/* =========================================
   SHORT SCREEN
========================================= */

@media(max-height:650px){

  #availableBookingsCard{
    height:100px;
  }

  #availableBookingsCard.expanded{
    height:72vh;
  }

}


/* =========================================
   VERY SMALL WIDTH
========================================= */

@media(max-width:360px){

  .headerBrand{
    font-size:18px;
  }

  .headerBrand small{
    font-size:9px;
  }

  .menuButton{
    width:42px !important;
    min-width:42px !important;
    height:42px;
  }

}


/* =========================================
   PREVENT PAGE SCROLL
========================================= */

body.sheet-dragging{
  overflow:hidden;
}

</style>

</head>


<body>


<header>

  <div class="headerBrand">

    🏍️ HABAL NA

    <small>
      Rider V5.5.4 • GPS Tracking
    </small>

  </div>


  <button
    id="menuButton"
    class="menuButton"
    onclick="toggleRiderMenu(event)"
    aria-label="Open rider menu"
  >
    ☰
  </button>

</header>


<div
  id="riderMenu"
  class="riderMenu"
>

  <div class="menuPanel">

    <div class="menuPanelTitle">

      <span>
        🏍️ Rider Profile
      </span>

      <button
        class="closeMenu"
        onclick="closeRiderMenu()"
      >
        ×
      </button>

    </div>


    <input
      id="riderName"
      type="text"
      placeholder="Rider Name"
    >


    <input
      id="riderContact"
      type="tel"
      placeholder="Rider Contact"
    >


    <button
      id="gpsButton"
      class="greenBtn"
      onclick="toggleRiderGPS()"
    >
      📍 START GPS
    </button>


    <div
      id="gpsStatus"
      class="gpsStatus"
    >
      GPS not started
    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<div class="container">

  <div class="mapCard">

    <div id="map"></div>

    <div
      id="mapGpsStatus"
      class="mapGpsStatus"
    >
      📍 GPS OFF
    </div>

  </div>

</div>


<div
  id="availableBookingsCard"
  class="card"
>

  <div
    id="bookingHandleArea"
    class="bookingHandleArea"
  >

    <div
      id="bookingHandle"
      class="bookingHandle"
    ></div>

  </div>


  <div
    id="bookingSheetHeader"
    class="bookingSheetHeader"
  >

    <div
      id="bookingSheetTitle"
      class="bookingSheetTitle"
    >
      📋 Available Bookings
    </div>

    <div
      id="bookingCount"
      class="bookingCount"
    >
      0
    </div>

  </div>


  <div id="bookingList">

    <div class="emptyBookings">
      Loading bookings...
    </div>

  </div>


  <div id="selectedBooking">

    <div id="selectedBookingContent"></div>


    <div class="actionGroup">

      <button
        id="acceptBtn"
        class="greenBtn"
        onclick="acceptSelectedRide()"
      >
        ✅ ACCEPT BOOKING
      </button>


      <button
        id="wazePickupBtn"
        class="blueBtn"
        onclick="wazeToPickup()"
      >
        📍 WAZE TO PICKUP
      </button>


      <button
        id="callPassengerBtn"
        class="orangeBtn"
        onclick="callPassenger()"
      >
        📞 CALL PASSENGER
      </button>


      <button
        id="pickedUpBtn"
        class="mainBtn"
        onclick="markPickedUp()"
      >
        🏍️ PICKED UP
      </button>


      <button
        id="wazeDestinationBtn"
        class="blueBtn"
        onclick="wazeToDestination()"
      >
        🗺️ WAZE TO DESTINATION
      </button>


      <button
        id="arrivedBtn"
        class="orangeBtn"
        onclick="markArrived()"
      >
        📍 ARRIVED
      </button>


      <button
        id="completeBtn"
        class="greenBtn"
        onclick="completeRide()"
      >
        ✅ COMPLETE RIDE
      </button>

    </div>

  </div>

</div>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://omkgcczffjtevwzsscwg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-7gCKDHORQ5gIACet6vJUg_X7HmdMeg";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   VARIABLES
========================================= */

let map = null;

let riderMarker = null;

let pickupMarker = null;

let destinationMarker = null;

let routeLine = null;

let riderLocation = null;

let selectedRide = null;

let rides = [];

let gpsWatchId = null;

let bookingSignature = "";

let routeRequestId = 0;

let loadingBookings = false;

let waitingListHidden = false;

let acceptingRideId = null;

let toastTimer = null;


/* =========================================
   MENU
========================================= */

function toggleRiderMenu(event){

  if(event){
    event.stopPropagation();
  }

  const menu =
    document.getElementById(
      "riderMenu"
    );

  menu.classList.toggle(
    "open"
  );

  invalidateMap();

}


function closeRiderMenu(){

  const menu =
    document.getElementById(
      "riderMenu"
    );

  menu.classList.remove(
    "open"
  );

  invalidateMap();

}


document.addEventListener(
  "click",
  function(event){

    const menu =
      document.getElementById(
        "riderMenu"
      );

    const button =
      document.getElementById(
        "menuButton"
      );


    if(
      !menu.contains(event.target) &&
      !button.contains(event.target)
    ){

      closeRiderMenu();

    }

  }
);


/* =========================================
   BOOKING SHEET VARIABLES
========================================= */

let bookingSheetExpanded = false;

let sheetStartY = 0;

let sheetCurrentY = 0;

let sheetDragging = false;

let sheetMoved = false;

let sheetStartTime = 0;

let sheetStartHeight = 110;


/* =========================================
   BOOKING SOUND
========================================= */

let bookingAudioContext = null;


function unlockBookingSound(){

  try{

    if(!bookingAudioContext){

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      bookingAudioContext =
        new AudioContext();

    }

    if(
      bookingAudioContext.state ===
      "suspended"
    ){

      bookingAudioContext.resume();

    }

  }catch(error){

    console.log(
      "Audio unlock error:",
      error
    );

  }

}


function playBookingSound(){

  try{

    unlockBookingSound();

    if(!bookingAudioContext){
      return;
    }

    const ctx =
      bookingAudioContext;

    const now =
      ctx.currentTime;


    const tones = [
      [880,0,.20],
      [1175,.22,.42],
      [1320,.44,.64]
    ];


    tones.forEach(
      function(tone){

        const osc =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        osc.type =
          "sine";

        osc.frequency.setValueAtTime(
          tone[0],
          now + tone[1]
        );

        gain.gain.setValueAtTime(
          0.0001,
          now + tone[1]
        );

        gain.gain.exponentialRampToValueAtTime(
          0.35,
          now + tone[1] + .02
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + tone[2]
        );

        osc.connect(gain);

        gain.connect(
          ctx.destination
        );

        osc.start(
          now + tone[1]
        );

        osc.stop(
          now + tone[2] + .02
        );

      }
    );

  }catch(error){

    console.log(
      "Booking sound error:",
      error
    );

  }

}

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function statusText(status){

  const values = {

    searching:"🔎 SEARCHING",

    accepted:"✅ ACCEPTED",

    picked_up:"🏍️ PICKED UP",

    arrived:"📍 ARRIVED",

    completed:"✅ COMPLETED"

  };

  return values[status] ||
    status;

}

/* =========================================
   DISTANCE
========================================= */

function calculateDistanceKm(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R = 6371;

  const dLat =
    (Number(lat2) -
      Number(lat1))
    * Math.PI / 180;

  const dLng =
    (Number(lng2) -
      Number(lng1))
    * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      Number(lat1) *
      Math.PI / 180
    ) *

    Math.cos(
      Number(lat2) *
      Math.PI / 180
    ) *

    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


function getPickupDistance(ride){

  if(
    !riderLocation ||
    ride.pickup_lat === null ||
    ride.pickup_lat === undefined ||
    ride.pickup_lng === null ||
    ride.pickup_lng === undefined
  ){

    return null;

  }

  return calculateDistanceKm(
    riderLocation.lat,
    riderLocation.lng,
    ride.pickup_lat,
    ride.pickup_lng
  );

}


function calculateRideDistances(){

  rides.forEach(
    function(ride){

      ride._pickupDistanceKm =
        getPickupDistance(
          ride
        );

    }
  );

}


function sortBookingsByPickupDistance(){

  calculateRideDistances();

  rides.sort(
    function(a,b){

      const da =
        a._pickupDistanceKm;

      const db =
        b._pickupDistanceKm;


      if(
        da === null &&
        db === null
      ){

        return 0;

      }


      if(da === null){
        return 1;
      }

      if(db === null){
        return -1;
      }

      return da - db;

    }
  );

}


function pickupDistanceText(ride){

  const distance =
    getPickupDistance(
      ride
    );


  if(distance === null){

    return `
      <span class="pickupDistance noGps">
        🏍️ Rider Distance: GPS OFF
      </span>
    `;

  }


  let text;


  if(distance < 1){

    text =
      Math.round(
        distance * 1000
      ) +
      " meters away";

  }else{

    text =
      distance.toFixed(2) +
      " km away";

  }


  return `
    <span class="pickupDistance">
      🏍️ ${escapeHTML(text)}
    </span>
  `;

}

/* =========================================
   BOOKING SHEET SWIPE
========================================= */

function setupBookingSheetSwipe(){

  const sheet =
    document.getElementById(
      "availableBookingsCard"
    );

  const handleArea =
    document.getElementById(
      "bookingHandleArea"
    );

  const headerArea =
    document.getElementById(
      "bookingSheetHeader"
    );


  if(
    !sheet ||
    !handleArea ||
    !headerArea
  ){

    return;

  }


  function startDrag(clientY){

    sheetDragging = true;

    sheetMoved = false;

    sheetStartY =
      clientY;

    sheetCurrentY =
      clientY;

    sheetStartTime =
      Date.now();

    sheetStartHeight =
      sheet.getBoundingClientRect()
        .height;

    sheet.classList.add(
      "dragging"
    );

    document.body.classList.add(
      "sheet-dragging"
    );

  }


  function moveDrag(clientY){

    if(!sheetDragging){
      return;
    }

    sheetCurrentY =
      clientY;

    const delta =
      sheetStartY -
      sheetCurrentY;


    if(Math.abs(delta) > 5){

      sheetMoved = true;

    }


    const minHeight =
      window.innerWidth <= 480
        ? 105
        : 110;


    const maxHeight =
      Math.min(
        window.innerHeight * .70,
        560
      );


    let newHeight =
      sheetStartHeight +
      delta;


    newHeight =
      Math.max(
        minHeight,
        Math.min(
          newHeight,
          maxHeight
        )
      );


    sheet.style.height =
      newHeight + "px";

  }


  function endDrag(){

    if(!sheetDragging){
      return;
    }


    const delta =
      sheetStartY -
      sheetCurrentY;


    const elapsed =
      Math.max(
        1,
        Date.now() -
        sheetStartTime
      );


    const velocity =
      Math.abs(delta) /
      elapsed;


    sheetDragging =
      false;


    sheet.classList.remove(
      "dragging"
    );

    document.body.classList.remove(
      "sheet-dragging"
    );


    sheet.style.height =
      "";


    if(
      delta > 45 ||
      (
        delta > 15 &&
        velocity > .35
      )
    ){

      openBookingSheet();

      sheetMoved = false;

      return;

    }


    if(
      delta < -45 ||
      (
        delta < -15 &&
        velocity > .35
      )
    ){

      closeBookingSheet();

      sheetMoved = false;

      return;

    }


    if(!sheetMoved){

      toggleBookingSheet();

    }


    sheetMoved = false;

  }


  function cancelDrag(){

    sheetDragging =
      false;

    sheet.style.height =
      "";

    sheet.classList.remove(
      "dragging"
    );

    document.body.classList.remove(
      "sheet-dragging"
    );

    sheetMoved = false;

  }


  function attachPointerEvents(element){

    element.addEventListener(
      "pointerdown",
      function(e){

        if(
          e.pointerType === "mouse" &&
          e.button !== 0
        ){

          return;

        }

        startDrag(
          e.clientY
        );

        try{

          element.setPointerCapture(
            e.pointerId
          );

        }catch(error){}

      }
    );


    element.addEventListener(
      "pointermove",
      function(e){

        if(!sheetDragging){
          return;
        }

        moveDrag(
          e.clientY
        );

      }
    );


    element.addEventListener(
      "pointerup",
      function(e){

        if(!sheetDragging){
          return;
        }

        try{

          element.releasePointerCapture(
            e.pointerId
          );

        }catch(error){}

        endDrag();

      }
    );


    element.addEventListener(
      "pointercancel",
      function(){

        cancelDrag();

      }
    );

  }


  attachPointerEvents(
    handleArea
  );

  attachPointerEvents(
    headerArea
  );

}

/* =========================================
   SWIPE ACCEPT
========================================= */

function createSwipeAccept(ride){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "swipeArea";


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "swipeText";

  text.textContent =
    "👉 SWIPE TO ACCEPT";


  const button =
    document.createElement(
      "button"
    );

  button.className =
    "swipeButton";

  button.textContent =
    "➜";


  wrapper.appendChild(
    text
  );

  wrapper.appendChild(
    button
  );


  let startX = 0;

  let currentX = 0;

  let dragging = false;


  function moveButton(x){

    const max =
      wrapper.clientWidth -
      52;


    currentX =
      Math.max(
        0,
        Math.min(
          x,
          max
        )
      );


    button.style.left =
      (
        currentX + 2
      ) + "px";

  }


  button.addEventListener(
    "touchstart",
    function(e){

      if(acceptingRideId){
        return;
      }

      unlockBookingSound();

      dragging = true;

      startX =
        e.touches[0].clientX;

    },
    {
      passive:true
    }
  );


  button.addEventListener(
    "touchmove",
    function(e){

      if(!dragging){
        return;
      }

      const x =
        e.touches[0].clientX -
        startX;

      moveButton(x);

    },
    {
      passive:true
    }
  );


  button.addEventListener(
    "touchend",
    function(){

      dragging = false;


      const max =
        wrapper.clientWidth -
        52;


      if(
        currentX >
        max * .75
      ){

        moveButton(max);

        acceptingRideId =
          ride.id;


        selectRide(
          ride.id
        );


        acceptRide(
          ride.id
        );

      }else{

        moveButton(0);

      }

    }
  );


  return wrapper;

}


/* =========================================
   RENDER BOOKINGS
========================================= */

function renderBookings(
  highlightNew = false
){

  if(waitingListHidden){

    updateBookingCount();

    return;

  }


  const list =
    document.getElementById(
      "bookingList"
    );


  if(!rides.length){

    list.innerHTML = `
      <div class="emptyBookings">
        📭 No available bookings.
      </div>
    `;

    updateBookingCount();

    return;

  }


  sortBookingsByPickupDistance();


  list.innerHTML = "";


  rides.forEach(
    function(ride,index){

      if(
        ride.status !==
        "searching"
      ){

        return;

      }


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "booking";


      if(
        selectedRide &&
        String(selectedRide.id) ===
        String(ride.id)
      ){

        div.classList.add(
          "active"
        );

      }


      if(highlightNew){

        div.classList.add(
          "newBooking"
        );

      }


      let nearestBadge = "";


      if(
        index === 0 &&
        getPickupDistance(ride) !== null
      ){

        nearestBadge = `
          <span class="nearestBadge">
            ⭐ NEAREST
          </span>
        `;

      }


      div.innerHTML = `

        <div class="bookingTitle">

          🚕 Available Passenger

          ${nearestBadge}

        </div>


        <div class="bookingInfo">

          📍 Pickup:

          ${Number(
            ride.pickup_lat
          ).toFixed(5)},

          ${Number(
            ride.pickup_lng
          ).toFixed(5)}

          <br>

          ${pickupDistanceText(
            ride
          )}

          <br>

          🏁 Destination:

          ${escapeHTML(
            ride.destination
          )}

          <br>

          📏 Trip Distance:

          ${Number(
            ride.distance_km || 0
          ).toFixed(2)}

          km

          <br>

          💰 Fare:

          ₱${Number(
            ride.estimated_fare || 0
          ).toFixed(2)}

          <br>

          <span class="status">

            ${statusText(
              ride.status
            )}

          </span>

        </div>

      `;


      div.onclick =
        function(){

          selectRide(
            ride.id
          );

        };


      if(
        ride.status ===
        "searching"
      ){

        div.appendChild(
          createSwipeAccept(
            ride
          )
        );

      }


      list.appendChild(
        div
      );

    }
  );


  updateBookingCount();

}


/* =========================================
   LOAD BOOKINGS
========================================= */

async function loadBookings(){

  if(loadingBookings){
    return;
  }


  loadingBookings =
    true;


  try{

    const {
      data,
      error
    } =
      await supabaseClient
      .from("rides")
      .select("*")
      .in(
        "status",
        [
          "searching",
          "accepted",
          "picked_up",
          "arrived"
        ]
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.log(error);

      showToast(
        "❌ Failed to load bookings"
      );

      return;

    }


    rides =
      data || [];


    const signature =
      JSON.stringify(
        rides.map(
          function(r){

            return [
              r.id,
              r.status,
              r.passenger_name,
              r.destination
            ];

          }
        )
      );


    if(
      signature !==
      bookingSignature
    ){

      bookingSignature =
        signature;


      renderBookings();


      if(selectedRide){

        const updated =
          rides.find(
            function(r){

              return String(r.id) ===
                String(selectedRide.id);

            }
          );


        if(updated){

          selectedRide =
            updated;

          showSelectedBooking();

        }

      }

    }else{

      if(!waitingListHidden){

        renderBookings();

      }

    }


  }catch(error){

    console.log(error);

  }finally{

    loadingBookings =
      false;

  }

}


/* =========================================
   ACCEPT RIDE
========================================= */

async function acceptRide(rideId){

  unlockBookingSound();


  if(
    acceptingRideId &&
    String(acceptingRideId) !==
    String(rideId)
  ){

    showToast(
      "⏳ Accepting another booking..."
    );

    return false;

  }


  acceptingRideId =
    rideId;


  const name =
    document.getElementById(
      "riderName"
    ).value.trim();


  const contact =
    document.getElementById(
      "riderContact"
    ).value.trim();


  if(!name){

    acceptingRideId =
      null;

    openRiderMenu();

    showToast(
      "⚠️ Enter rider name first"
    );

    return false;

  }


  if(!contact){

    acceptingRideId =
      null;

    openRiderMenu();

    showToast(
      "⚠️ Enter rider contact first"
    );

    return false;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
      .from("rides")
      .update({

        status:"accepted",

        rider_name:name,

        rider_contact:contact,

        rider_lat:
          riderLocation
            ? riderLocation.lat
            : null,

        rider_lng:
          riderLocation
            ? riderLocation.lng
            : null

      })
      .eq(
        "id",
        rideId
      )
      .eq(
        "status",
        "searching"
      )
      .select()
      .maybeSingle();


    if(error){

      console.log(error);

      acceptingRideId =
        null;

      showToast(
        "❌ Accept failed"
      );

      return false;

    }


    if(!data){

      acceptingRideId =
        null;

      showToast(
        "⚠️ Booking already accepted"
      );

      await loadBookings();

      return false;

    }


    selectedRide =
      data;

    acceptingRideId =
      null;


    setWaitingListHidden(
      true
    );


    const index =
      rides.findIndex(
        function(r){

          return String(r.id) ===
            String(data.id);

        }
      );


    if(index >= 0){

      rides[index] =
        data;

    }else{

      rides.push(
        data
      );

    }


    bookingSignature =
      "";


    showSelectedBooking();

    drawRideOnMap(
      data
    );


    showToast(
      "✅ BOOKING ACCEPTED!"
    );


    return true;

  }catch(error){

    console.log(error);

    acceptingRideId =
      null;

    showToast(
      "❌ Accept error"
    );

    return false;

  }

}


async function acceptSelectedRide(){

  unlockBookingSound();


  if(!selectedRide){

    showToast(
      "⚠️ Select a booking"
    );

    return;

  }


  await acceptRide(
    selectedRide.id
  );

}


/* =========================================
   LOCAL RIDE
========================================= */

function updateLocalRide(ride){

  const index =
    rides.findIndex(
      function(r){

        return String(r.id) ===
          String(ride.id);

      }
    );


  if(index >= 0){

    rides[index] =
      ride;

  }else{

    rides.push(
      ride
    );

  }


  bookingSignature =
    "";


  if(
    ride.status === "accepted" ||
    ride.status === "picked_up" ||
    ride.status === "arrived"
  ){

    setWaitingListHidden(
      true
    );

  }


  if(!waitingListHidden){

    renderBookings();

  }

}

/* =========================================
   COMPLETE RIDE
========================================= */

async function completeRide(){

  unlockBookingSound();


  if(!selectedRide){
    return;
  }


  const completedRideId =
    selectedRide.id;


  const {
    data,
    error
  } =
    await supabaseClient
    .from("rides")
    .update({
      status:"completed"
    })
    .eq(
      "id",
      selectedRide.id
    )
    .select()
    .single();


  if(error){

    console.log(error);

    showToast(
      "❌ Failed to complete ride"
    );

    return;

  }


  selectedRide =
    null;

  acceptingRideId =
    null;


  setWaitingListHidden(
    false
  );


  rides =
    rides.filter(
      function(r){

        return String(r.id) !==
          String(completedRideId);

      }
    );


  bookingSignature =
    "";


  await loadBookings();


  setWaitingListHidden(
    false
  );


  renderBookings();


  showToast(
    "✅ PASSENGER DROPPED OFF! New bookings are available."
  );

}


/* =========================================
   WAZE
========================================= */

function openWaze(lat,lng){

  if(
    lat === null ||
    lng === null ||
    lat === undefined ||
    lng === undefined
  ){

    showToast(
      "⚠️ Location unavailable"
    );

    return;

  }


  const intentUrl =
    "intent://?ll=" +
    lat +
    "," +
    lng +
    "&navigate=yes" +
    "#Intent;" +
    "scheme=waze;" +
    "package=com.waze;" +
    "end";


  try{

    window.location.href =
      intentUrl;

  }catch(error){

    console.log(error);

    window.location.href =
      "https://waze.com/ul?ll=" +
      lat +
      "," +
      lng +
      "&navigate=yes";

  }

}


function wazeToPickup(){

  if(!selectedRide){
    return;
  }

  unlockBookingSound();

  openWaze(
    selectedRide.pickup_lat,
    selectedRide.pickup_lng
  );

}


function wazeToDestination(){

  if(!selectedRide){
    return;
  }

  unlockBookingSound();

  openWaze(
    selectedRide.destination_lat,
    selectedRide.destination_lng
  );

}

/* =========================================
   GPS
========================================= */

function updateGpsUI(
  active,
  text
){

  const button =
    document.getElementById(
      "gpsButton"
    );

  const status =
    document.getElementById(
      "gpsStatus"
    );

  const mapStatus =
    document.getElementById(
      "mapGpsStatus"
    );


  if(active){

    button.textContent =
      "🛑 STOP GPS";

    status.textContent =
      text;

    mapStatus.textContent =
      "📍 GPS ACTIVE";

    mapStatus.classList.add(
      "active"
    );

  }else{

    button.textContent =
      "📍 START GPS";

    status.textContent =
      text;

    mapStatus.textContent =
      "📍 GPS OFF";

    mapStatus.classList.remove(
      "active"
    );

  }

}


function openRiderMenu(){

  const menu =
    document.getElementById(
      "riderMenu"
    );

  menu.classList.add(
    "open"
  );

  invalidateMap();

}


function toggleRiderGPS(){

  unlockBookingSound();


  if(
    gpsWatchId !== null
  ){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId =
      null;


    updateGpsUI(
      false,
      "GPS stopped"
    );


    calculateRideDistances();


    if(!waitingListHidden){

      renderBookings();

    }

    return;

  }


  startRiderGPS();

}


function startRiderGPS(){

  unlockBookingSound();


  if(
    !navigator.geolocation
  ){

    showToast(
      "❌ GPS not supported"
    );

    return;

  }


  updateGpsUI(
    true,
    "Getting GPS location..."
  );


  gpsWatchId =
    navigator.geolocation.watchPosition(

      async function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        riderLocation = {
          lat:lat,
          lng:lng
        };


        updateRiderMarker(
          lat,
          lng
        );


        updateGpsUI(
          true,
          "GPS active: " +
          lat.toFixed(6) +
          ", " +
          lng.toFixed(6)
        );


        calculateRideDistances();


        if(!waitingListHidden){

          renderBookings();

        }


        if(selectedRide){

          try{

            await supabaseClient
              .from("rides")
              .update({

                rider_lat:lat,

                rider_lng:lng

              })
              .eq(
                "id",
                selectedRide.id
              )
              .in(
                "status",
                [
                  "accepted",
                  "picked_up",
                  "arrived"
                ]
              );

          }catch(error){

            console.log(error);

          }

        }

      },


      function(error){

        console.log(error);


        updateGpsUI(
          false,
          "GPS error: " +
          error.message
        );


        showToast(
          "❌ GPS error"
        );

      },


      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:15000
      }

    );

}


/* =========================================
   RIDER MARKER
========================================= */

function updateRiderMarker(lat,lng){

  if(!map){
    return;
  }


  if(!riderMarker){

    riderMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🏍️ Rider"
      );

  }else{

    riderMarker.setLatLng(
      [lat,lng]
    );

  }

}


/* =========================================
   DRAW RIDE
========================================= */

async function drawRideOnMap(ride){

  if(!map){
    return;
  }


  const currentRequest =
    ++routeRequestId;


  if(pickupMarker){

    map.removeLayer(
      pickupMarker
    );

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  if(routeLine){

    map.removeLayer(
      routeLine
    );

  }


  if(
    ride.pickup_lat &&
    ride.pickup_lng
  ){

    pickupMarker =
      L.marker(
        [
          Number(
            ride.pickup_lat
          ),
          Number(
            ride.pickup_lng
          )
        ]
      )
      .addTo(map)
      .bindPopup(
        "📍 Pickup"
      );

  }


  if(
    ride.destination_lat &&
    ride.destination_lng
  ){

    destinationMarker =
      L.marker(
        [
          Number(
            ride.destination_lat
          ),
          Number(
            ride.destination_lng
          )
        ]
      )
      .addTo(map)
      .bindPopup(
        "🏁 Destination"
      );

  }


  if(
    ride.pickup_lat &&
    ride.pickup_lng &&
    ride.destination_lat &&
    ride.destination_lng
  ){

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +

      ride.pickup_lng +
      "," +
      ride.pickup_lat +

      ";" +

      ride.destination_lng +
      "," +
      ride.destination_lat +

      "?overview=full&geometries=geojson";


    try{

      const response =
        await fetch(url);


      const data =
        await response.json();


      if(
        currentRequest !==
        routeRequestId
      ){

        return;

      }


      if(
        data.routes &&
        data.routes.length
      ){

        routeLine =
          L.geoJSON(
            data.routes[0].geometry,
            {
              style:{
                weight:6
              }
            }
          )
          .addTo(map);


        map.fitBounds(
          routeLine.getBounds(),
          {
            paddingTopLeft:[
              30,
              80
            ],

            paddingBottomRight:[
              30,
              150
            ]
          }
        );

      }

    }catch(error){

      console.log(
        "OSRM error:",
        error
      );

    }

  }

}


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  supabaseClient

    .channel(
      "rides-realtime-rider"
    )

    .on(
      "postgres_changes",

      {
        event:"INSERT",
        schema:"public",
        table:"rides"
      },

      function(payload){

        const ride =
          payload.new;


        if(
          ride &&
          ride.status ===
          "searching"
        ){

          const exists =
            rides.some(
              function(r){

                return String(r.id) ===
                  String(ride.id);

              }
            );


          if(!exists){

            rides.push(
              ride
            );


            bookingSignature =
              "";


            playBookingSound();


            sortBookingsByPickupDistance();


            if(waitingListHidden){

              showToast(
                "🔔 NEW BOOKING WAITING"
              );

            }else{

              renderBookings(
                true
              );


              showToast(
                "🔔 NEW BOOKING RECEIVED!"
              );

            }

          }

        }

      }
    )


    .on(
      "postgres_changes",

      {
        event:"UPDATE",
        schema:"public",
        table:"rides"
      },

      function(payload){

        const ride =
          payload.new;


        if(!ride){
          return;
        }


        const index =
          rides.findIndex(
            function(r){

              return String(r.id) ===
                String(ride.id);

            }
          );


        if(
          ride.status ===
          "completed"
        ){

          if(index >= 0){

            rides.splice(
              index,
              1
            );

          }


          if(
            selectedRide &&
            String(selectedRide.id) ===
            String(ride.id)
          ){

            selectedRide =
              null;

            setWaitingListHidden(
              false
            );

          }


          bookingSignature =
            "";


          renderBookings();

          return;

        }


        if(index >= 0){

          rides[index] =
            ride;

        }else{

          rides.push(
            ride
          );

        }


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(ride.id)
        ){

          selectedRide =
            ride;


          showSelectedBooking();


          drawRideOnMap(
            ride
          );

        }


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(ride.id) &&

          (
            ride.status === "accepted" ||
            ride.status === "picked_up" ||
            ride.status === "arrived"
          )
        ){

          setWaitingListHidden(
            true
          );

        }


        bookingSignature =
          "";


        if(!waitingListHidden){

          renderBookings();

        }

      }
    )


    .on(
      "postgres_changes",

      {
        event:"DELETE",
        schema:"public",
        table:"rides"
      },

      function(payload){

        const oldRide =
          payload.old;


        rides =
          rides.filter(
            function(r){

              return String(r.id) !==
                String(oldRide.id);

            }
          );


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(oldRide.id)
        ){

          selectedRide =
            null;


          setWaitingListHidden(
            false
          );

        }


        bookingSignature =
          "";


        renderBookings();

      }
    )


    .subscribe(
      function(status){

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}
