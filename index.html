/* =========================================
   BOOKING SOUND
========================================= */

let bookingAudioContext = null;


function unlockBookingSound(){

  try{

    if(!bookingAudioContext){

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      bookingAudioContext =
        new AudioContext();

    }

    if(
      bookingAudioContext.state ===
      "suspended"
    ){

      bookingAudioContext.resume();

    }

  }catch(error){

    console.log(
      "Audio unlock error:",
      error
    );

  }

}


function playBookingSound(){

  try{

    unlockBookingSound();

    if(!bookingAudioContext){
      return;
    }

    const ctx =
      bookingAudioContext;

    const now =
      ctx.currentTime;


    const osc1 =
      ctx.createOscillator();

    const gain1 =
      ctx.createGain();

    osc1.type =
      "sine";

    osc1.frequency.setValueAtTime(
      880,
      now
    );

    gain1.gain.setValueAtTime(
      0.0001,
      now
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.35,
      now + 0.02
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.20
    );

    osc1.connect(gain1);
    gain1.connect(ctx.destination);

    osc1.start(now);
    osc1.stop(now + 0.22);


    const osc2 =
      ctx.createOscillator();

    const gain2 =
      ctx.createGain();

    osc2.type =
      "sine";

    osc2.frequency.setValueAtTime(
      1175,
      now + 0.22
    );

    gain2.gain.setValueAtTime(
      0.0001,
      now + 0.22
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.35,
      now + 0.24
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.42
    );

    osc2.connect(gain2);
    gain2.connect(ctx.destination);

    osc2.start(now + 0.22);
    osc2.stop(now + 0.44);


    const osc3 =
      ctx.createOscillator();

    const gain3 =
      ctx.createGain();

    osc3.type =
      "sine";

    osc3.frequency.setValueAtTime(
      1320,
      now + 0.44
    );

    gain3.gain.setValueAtTime(
      0.0001,
      now + 0.44
    );

    gain3.gain.exponentialRampToValueAtTime(
      0.30,
      now + 0.46
    );

    gain3.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.62
    );

    osc3.connect(gain3);
    gain3.connect(ctx.destination);

    osc3.start(now + 0.44);
    osc3.stop(now + 0.64);

  }catch(error){

    console.log(
      "Booking sound error:",
      error
    );

  }

}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function statusText(status){

  const values = {

    searching:
      "🔎 SEARCHING",

    accepted:
      "✅ ACCEPTED",

    picked_up:
      "🏍️ PICKED UP",

    arrived:
      "📍 ARRIVED",

    completed:
      "✅ COMPLETED"

  };

  return values[status] || status;

}

  toast.textContent =

  toast.classList.add("show");

  setTimeout(
    function(){

      toast.classList.remove("show");

    },
    3500
  );

}


/* =========================================
   RIDER -> PICKUP DISTANCE
========================================= */

/*
  Calculate straight-line distance
  between rider GPS and pickup GPS.

  Result is returned in kilometers.
*/

function calculateDistanceKm(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R = 6371;

  const dLat =
    (Number(lat2) - Number(lat1))
    * Math.PI / 180;

  const dLng =
    (Number(lng2) - Number(lng1))
    * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      Number(lat1) * Math.PI / 180
    ) *

    Math.cos(
      Number(lat2) * Math.PI / 180
    ) *

    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


function getPickupDistance(
  ride
){

  if(
    !riderLocation ||
    ride.pickup_lat === null ||
    ride.pickup_lat === undefined ||
    ride.pickup_lng === null ||
    ride.pickup_lng === undefined
  ){

    return null;

  }

  return calculateDistanceKm(
    riderLocation.lat,
    riderLocation.lng,
    ride.pickup_lat,
    ride.pickup_lng
  );

}


/*
  Add temporary calculated distance
  to each booking.

  This value is NOT saved to Supabase.
*/

function calculateRideDistances(){

  rides.forEach(
    function(ride){

      ride._pickupDistanceKm =
        getPickupDistance(ride);

    }
  );

}


/*
  Nearest pickup first.

  Bookings without rider GPS
  stay after bookings with distance.
*/

function sortBookingsByPickupDistance(){

  calculateRideDistances();

  rides.sort(
    function(a,b){

      const da =
        a._pickupDistanceKm;

      const db =
        b._pickupDistanceKm;


      if(
        da === null &&
        db === null
      ){

        return 0;

      }


      if(da === null){

        return 1;

      }


      if(db === null){

        return -1;

      }


      return da - db;

    }
  );

}


function pickupDistanceText(
  ride
){

  const distance =
    getPickupDistance(ride);


  if(distance === null){

    return `
      <span class="pickupDistance noGps">
        🏍️ Rider Distance: GPS OFF
      </span>
    `;

  }


  let text;


  if(distance < 1){

    text =
      Math.round(
        distance * 1000
      ) +
      " meters away";

  }else{

    text =
      distance.toFixed(2) +
      " km away";

  }


  return `
    <span class="pickupDistance">
      🏍️ ${escapeHTML(text)}
    </span>
  `;

}

/* =========================================
   SELECT RIDE
========================================= */

function selectRide(id){

  const ride =
    rides.find(
      function(r){

        return String(r.id) ===
          String(id);

      }
    );

  if(!ride){
    return;
  }


  if(
    waitingListHidden &&
    selectedRide &&
    String(selectedRide.id) !==
    String(ride.id)
  ){

    return;

  }


  selectedRide =
    ride;

  showSelectedBooking();

  drawRideOnMap(
    ride

}

/* =========================================
   SWIPE ACCEPT
========================================= */

function createSwipeAccept(ride){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "swipeArea";


  const text =
    document.createElement("div");

  text.className =
    "swipeText";

  text.textContent =
    "👉 SWIPE TO ACCEPT";


  const button =
    document.createElement("button");

  button.className =
    "swipeButton";

  button.textContent =
    "➜";


  wrapper.appendChild(text);
  wrapper.appendChild(button);


  let startX = 0;
  let currentX = 0;
  let dragging = false;


  function moveButton(x){

    const max =
      wrapper.clientWidth - 52;

    currentX =
      Math.max(
        0,
        Math.min(x,max)
      );

    button.style.left =
      (currentX + 2) + "px";

  }


  button.addEventListener(
    "touchstart",
    function(e){

      if(acceptingRideId){
        return;
      }

      unlockBookingSound();

      dragging = true;

      startX =
        e.touches[0].clientX;

    },
    {passive:true}
  );


  button.addEventListener(
    "touchmove",
    function(e){

      if(!dragging){
        return;
      }

      const x =
        e.touches[0].clientX -
        startX;

      moveButton(x);

    },
    {passive:true}
  );


  button.addEventListener(
    "touchend",
    function(){

      dragging = false;

      const max =
        wrapper.clientWidth - 52;


      if(currentX > max * 0.75){

        moveButton(max);

        acceptingRideId =
          ride.id;

        selectRide(
          ride.id
        );

        acceptRide(
          ride.id
        );

      }else{

        moveButton(0);

      }

    }
  );


  return wrapper;

}


/* =========================================
   RENDER BOOKINGS
========================================= */

function renderBookings(
  highlightNew = false
){

  if(waitingListHidden){

    setWaitingListHidden(true);

    return;

  }


  setWaitingListHidden(false);


  const list =
    document.getElementById(
      "bookingList"
    );


  if(!rides.length){

    list.innerHTML =
      "<p>No available bookings.</p>";

    return;

  }


  /*
    NEW:
    Calculate rider -> pickup distance
    and sort nearest first.
  */

  sortBookingsByPickupDistance();


  list.innerHTML = "";


  rides.forEach(
    function(ride,index){

      const div =
        document.createElement("div");

      div.className =
        "booking";


      if(
        selectedRide &&
        String(selectedRide.id) ===
        String(ride.id)
      ){

        div.classList.add("active");

      }


      if(highlightNew){

        div.classList.add(
          "newBooking"
        );

      }


      let nearestBadge = "";


      /*
        Show nearest badge only for
        the first booking when GPS exists.
      */

      if(
        index === 0 &&
        getPickupDistance(ride) !== null
      ){

        nearestBadge =
          `
          <span class="nearestBadge">
            ⭐ NEAREST
          </span>
          `;

      }


      /*
        IMPORTANT PRIVACY:
        Passenger name/contact remain
        hidden until accepted.
      */

      div.innerHTML = `

        <div class="bookingTitle">
          🚕 Available Passenger
          ${nearestBadge}
        </div>

        <div class="bookingInfo">

          📍 Pickup:
          ${Number(
            ride.pickup_lat
          ).toFixed(5)},
          ${Number(
            ride.pickup_lng
          ).toFixed(5)}

          <br>

          ${pickupDistanceText(ride)}

          <br>

          🏁 Destination:
          ${escapeHTML(
            ride.destination
          )}

          <br>

          📏 Trip Distance:
          ${Number(
            ride.distance_km || 0
          ).toFixed(2)}
          km

          <br>

          💰 Fare:
          ₱${Number(
            ride.estimated_fare || 0
          ).toFixed(2)}

          <br>

          <span class="status">
            ${statusText(
              ride.status
            )}
          </span>

        </div>

      `;


      div.onclick =
        function(){

          selectRide(
            ride.id
          );

        };


      if(
        ride.status ===
        "searching"
      ){

        div.appendChild(
          createSwipeAccept(
            ride
          )
        );

      }


      list.appendChild(div);

    }
  );

}


/* =========================================
   LOAD BOOKINGS
========================================= */

async function loadBookings(){

  if(loadingBookings){
    return;
  }

  loadingBookings = true;


  try{

    const {
      data,
      error
    } =
      await supabaseClient
      .from("rides")
      .select("*")
      .in(
        "status",
        [
          "searching",
          "accepted",
          "picked_up",
          "arrived"
        ]
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.log(error);

      showToast(
        "❌ Failed to load bookings"
      );

      return;

    }


    rides =
      data || [];


    const signature =
      JSON.stringify(
        rides.map(
          function(r){

            return [
              r.id,
              r.status,
              r.passenger_name,
              r.destination
            ];

          }
        )
      );


    if(
      signature !==
      bookingSignature
    ){

      bookingSignature =
        signature;

      renderBookings();


      if(selectedRide){

        const updated =
          rides.find(
            function(r){

              return String(r.id) ===
                String(
                  selectedRide.id
                );

            }
          );


        if(updated){

          selectedRide =
            updated;

          showSelectedBooking();

        }

      }

    }else{

      /*
        Even if Supabase data did not change,
        rider GPS may have changed.
      */

      if(!waitingListHidden){

        renderBookings();

      }

    }


  }catch(error){

    console.log(error);

  }finally{

    loadingBookings = false;

  }

}


/* =========================================
   ACCEPT RIDE
========================================= */

async function acceptRide(
  rideId
){

  unlockBookingSound();


  if(
    acceptingRideId &&
    String(acceptingRideId) !==
    String(rideId)
  ){

    showToast(
      "⏳ Accepting another booking..."
    );

    return false;

  }


  acceptingRideId =
    rideId;


  const name =
    document.getElementById(
      "riderName"
    ).value.trim();


  const contact =
    document.getElementById(
      "riderContact"
    ).value.trim();


  if(!name){

    acceptingRideId = null;

    showToast(
      "⚠️ Enter rider name first"
    );

    return false;

  }


  if(!contact){

    acceptingRideId = null;

    showToast(
      "⚠️ Enter rider contact first"
    );

    return false;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
      .from("rides")
      .update({

        status:"accepted",

        rider_name:name,

        rider_contact:contact,

        rider_lat:
          riderLocation
            ? riderLocation.lat
            : null,

        rider_lng:
          riderLocation
            ? riderLocation.lng
            : null

      })
      .eq(
        "id",
        rideId
      )
      .eq(
        "status",
        "searching"
      )
      .select()
      .maybeSingle();


    if(error){

      console.log(error);

      acceptingRideId = null;

      showToast(
        "❌ Accept failed"
      );

      return false;

    }


    if(!data){

      acceptingRideId = null;

      showToast(
        "⚠️ Booking already accepted"
      );

      await loadBookings();

      return false;

    }


    selectedRide =
      data;


    acceptingRideId =
      null;


    setWaitingListHidden(true);


    const index =
      rides.findIndex(
        function(r){

          return String(r.id) ===
            String(data.id);

        }
      );


    if(index >= 0){

      rides[index] =
        data;

    }else{

      rides.push(data);

    }


    bookingSignature = "";


    showSelectedBooking();

    drawRideOnMap(data);


    setWaitingListHidden(true);


    showToast(
      "✅ BOOKING ACCEPTED!"
    );


    return true;

  }catch(error){

    console.log(error);

    acceptingRideId = null;

    showToast(
      "❌ Accept error"
    );

    return false;

  }

}


async function acceptSelectedRide(){

  unlockBookingSound();


  if(!selectedRide){

    showToast(
      "⚠️ Select a booking"
    );

    return;

  }


  await acceptRide(
    selectedRide.id
  );

}


/* =========================================
   UPDATE LOCAL RIDE
========================================= */

function updateLocalRide(ride){

  const index =
    rides.findIndex(
      function(r){

        return String(r.id) ===
          String(ride.id);

      }
    );


  if(index >= 0){

    rides[index] =
      ride;

  }else{

    rides.push(ride);

  }


  bookingSignature = "";


  if(
    ride.status === "accepted" ||
    ride.status === "picked_up" ||
    ride.status === "arrived"
  ){

    setWaitingListHidden(true);

  }


  renderBookings();

}

/* =========================================
   COMPLETE RIDE
========================================= */

async function completeRide(){

  unlockBookingSound();


  if(!selectedRide){
    return;
  }


  const completedRideId =
    selectedRide.id;


  const {
    data,
    error
  } =
    await supabaseClient
    .from("rides")
    .update({
      status:"completed"
    })
    .eq(
      "id",
      selectedRide.id
    )
    .select()
    .single();


  if(error){

    console.log(error);

    showToast(
      "❌ Failed to complete ride"
    );

    return;

  }


  selectedRide = null;

  acceptingRideId = null;


  document.getElementById(
    "selectedBooking"
  ).style.display =
    "none";


  rides =
    rides.filter(
      function(r){

        return String(r.id) !==
          String(completedRideId);

      }
    );


  bookingSignature = "";


  setWaitingListHidden(false);


  await loadBookings();


  setWaitingListHidden(false);

  renderBookings();


  showToast(
    "✅ PASSENGER DROPPED OFF! New bookings are available."
  );

}


/* =========================================
   WAZE
========================================= */

function openWaze(
  lat,
  lng
){

  if(
    lat === null ||
    lng === null ||
    lat === undefined ||
    lng === undefined
  ){

    showToast(
      "⚠️ Location unavailable"
    );

    return;

  }


  const intentUrl =
    "intent://?ll=" +
    lat +
    "," +
    lng +
    "&navigate=yes" +
    "#Intent;" +
    "scheme=waze;" +
    "package=com.waze;" +
    "end";


  try{

    window.location.href =
      intentUrl;

  }catch(error){

    console.log(error);

    window.location.href =
      "https://waze.com/ul?ll=" +
      lat +
      "," +
      lng +
      "&navigate=yes";

  }

}


function wazeToPickup(){

  if(!selectedRide){
    return;
  }

  unlockBookingSound();

  openWaze(
    selectedRide.pickup_lat,
    selectedRide.pickup_lng
  );

}


function wazeToDestination(){

  if(!selectedRide){
    return;
  }

  unlockBookingSound();

  openWaze(
    selectedRide.destination_lat,
    selectedRide.destination_lng
  );

}

/* =========================================
   GPS
========================================= */

function toggleRiderGPS(){

  unlockBookingSound();


  if(gpsWatchId !== null){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId = null;


    document.getElementById(
      "gpsButton"
    ).textContent =
      "📍 START GPS";


    document.getElementById(
      "gpsStatus"
    ).textContent =
      "GPS stopped";


    /*
      Re-render so distance changes
      to GPS OFF.
    */

    calculateRideDistances();

    if(!waitingListHidden){

      renderBookings();

    }

    return;

  }


  startRiderGPS();

}


function startRiderGPS(){

  unlockBookingSound();


  if(!navigator.geolocation){

    showToast(
      "❌ GPS not supported"
    );

    return;

  }


  document.getElementById(
    "gpsButton"
  ).textContent =
    "🛑 STOP GPS";


  document.getElementById(
    "gpsStatus"
  ).textContent =
    "Getting GPS location...";


  gpsWatchId =
    navigator.geolocation.watchPosition(

      async function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        riderLocation = {
          lat:lat,
          lng:lng
        };


        updateRiderMarker(
          lat,
          lng
        );


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "GPS active: " +
          lat.toFixed(6) +
          ", " +
          lng.toFixed(6);


        /*
          NEW:
          Recalculate every booking's
          Rider -> Pickup distance.
        */

        calculateRideDistances();


        /*
          NEW:
          Automatically move nearest
          pickup to the top.
        */

        if(!waitingListHidden){

          renderBookings();

        }


        if(selectedRide){

          try{

            await supabaseClient
              .from("rides")
              .update({

                rider_lat:lat,

                rider_lng:lng

              })
              .eq(
                "id",
                selectedRide.id
              )
              .in(
                "status",
                [
                  "accepted",
                  "picked_up",
                  "arrived"
                ]
              );

          }catch(error){

            console.log(error);

          }

        }

      },

      function(error){

        console.log(error);

        document.getElementById(
          "gpsStatus"
        ).textContent =
          "GPS error: " +
          error.message;

        showToast(
          "❌ GPS error"
        );

      },

      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:15000
      }

    );

}


/* =========================================
   RIDER MARKER
========================================= */

function updateRiderMarker(
  lat,
  lng
){

  if(!map){
    return;
  }


  if(!riderMarker){

    riderMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🏍️ Rider"
      );

  }else{

    riderMarker.setLatLng(
      [lat,lng]
    );

  }

}


/* =========================================
   DRAW RIDE ON MAP
========================================= */

async function drawRideOnMap(
  ride
){

  if(!map){
    return;
  }


  const currentRequest =
    ++routeRequestId;


  if(pickupMarker){

    map.removeLayer(
      pickupMarker
    );

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  if(routeLine){

    map.removeLayer(
      routeLine
    );

  }


  if(
    ride.pickup_lat &&
    ride.pickup_lng
  ){

    pickupMarker =
      L.marker(
        [
          Number(ride.pickup_lat),
          Number(ride.pickup_lng)
        ]
      )
      .addTo(map)
      .bindPopup(
        "📍 Pickup"
      );

  }


  if(
    ride.destination_lat &&
    ride.destination_lng
  ){

    destinationMarker =
      L.marker(
        [
          Number(ride.destination_lat),
          Number(ride.destination_lng)
        ]
      )
      .addTo(map)
      .bindPopup(
        "🏁 Destination"
      );

  }


  if(
    ride.pickup_lat &&
    ride.pickup_lng &&
    ride.destination_lat &&
    ride.destination_lng
  ){

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      ride.pickup_lng +
      "," +
      ride.pickup_lat +
      ";" +
      ride.destination_lng +
      "," +
      ride.destination_lat +
      "?overview=full&geometries=geojson";


    try{

      const response =
        await fetch(url);

      const data =
        await response.json();


      if(
        currentRequest !==
        routeRequestId
      ){

        return;

      }


      if(
        data.routes &&
        data.routes.length
      ){

        routeLine =
          L.geoJSON(
            data.routes[0].geometry,
            {
              style:{
                weight:6
              }
            }
          )
          .addTo(map);


        map.fitBounds(
          routeLine.getBounds(),
          {
            padding:[30,30]
          }
        );

      }

    }catch(error){

      console.log(
        "OSRM error:",
        error
      );

    }

  }

}


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  supabaseClient
    .channel(
      "rides-realtime-rider"
    )

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"rides"
      },
      function(payload){

        const ride =
          payload.new;


        if(
          ride &&
          ride.status === "searching"
        ){

          const exists =
            rides.some(
              function(r){

                return String(r.id) ===
                  String(ride.id);

              }
            );


          if(!exists){

            rides.push(ride);

            bookingSignature = "";

            playBookingSound();


            /*
              Sort new booking according
              to rider distance.
            */

            sortBookingsByPickupDistance();


            if(waitingListHidden){

              showToast(
                "🔔 NEW BOOKING WAITING"
              );

            }else{

              renderBookings(true);

              showToast(
                "🔔 NEW BOOKING RECEIVED!"
              );

            }

          }

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"rides"
      },
      function(payload){

        const ride =
          payload.new;


        if(!ride){
          return;
        }


        const index =
          rides.findIndex(
            function(r){

              return String(r.id) ===
                String(ride.id);

            }
          );


        if(ride.status === "completed"){

          if(index >= 0){

            rides.splice(
              index,
              1
            );

          }


          if(
            selectedRide &&
            String(selectedRide.id) ===
            String(ride.id)
          ){

            selectedRide = null;

            document.getElementById(
              "selectedBooking"
            ).style.display =
              "none";

          }


          if(waitingListHidden){

            setWaitingListHidden(false);

            loadBookings();

          }


          bookingSignature = "";

          renderBookings();

          return;

        }


        if(index >= 0){

          rides[index] =
            ride;

        }else{

          rides.push(ride);

        }


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(ride.id)
        ){

          selectedRide =
            ride;

          showSelectedBooking();

          drawRideOnMap(ride);

        }


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(ride.id) &&
          (
            ride.status === "accepted" ||
            ride.status === "picked_up" ||
            ride.status === "arrived"
          )
        ){

          setWaitingListHidden(true);

        }


        bookingSignature = "";

        renderBookings();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"DELETE",
        schema:"public",
        table:"rides"
      },
      function(payload){

        const oldRide =
          payload.old;


        rides =
          rides.filter(
            function(r){

              return String(r.id) !==
                String(oldRide.id);

            }
          );


        if(
          selectedRide &&
          String(selectedRide.id) ===
          String(oldRide.id)
        ){

          selectedRide = null;

          document.getElementById(
            "selectedBooking"
          ).style.display =
            "none";

          setWaitingListHidden(false);

        }


        bookingSignature = "";

        renderBookings();

      }
    )

    .subscribe(
      function(status){

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}


/* =========================================
   START APP
========================================= */

initMap();

subscribeRealtime();

loadBookings();


setTimeout(

    if(map){

      map.invalidateSize();

    }

  },
  500
);


document.addEventListener(

  }
